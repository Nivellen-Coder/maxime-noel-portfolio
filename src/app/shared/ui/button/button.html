<button
  class="nds-button__native"
  type="button"
  [disabled]="disabledState()"
  [attr.aria-busy]="loading()"
  [attr.data-variant]="variant()"
  [attr.data-color]="color()"
  [attr.data-size]="size()">

  @if (loading()) {

    <span
      class="nds-button__spinner"
      aria-hidden="true">
    </span>

  } @else {

    <span class="nds-button__prefix">
      <ng-content select="[prefix]" />
    </span>

  }

  <span class="nds-button__label">
    <ng-content />
  </span>

  @if (!loading()) {

    <span class="nds-button__suffix">
      <ng-content select="[suffix]" />
    </span>

  }

</button>
