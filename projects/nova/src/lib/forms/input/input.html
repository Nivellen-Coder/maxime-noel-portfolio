<div class="nds-input__wrapper">

  <div class="nds-input__prefix">
    <ng-content select="[ndsPrefix]" />
  </div>

  <input
    class="nds-input__native"
    ndsFieldControl
    [id]="controlId()"
    [type]="nativeType()"
    [placeholder]="placeholder()"
    [value]="value()"
    [disabled]="isDisabled()"
    [readOnly]="readonly()"
    [required]="isRequired()"
    [attr.aria-labelledby]="labelId()"
    [attr.aria-describedby]="describedBy()"
    [attr.aria-invalid]="invalid() ? 'true' : null"
    (input)="onInput($event)"
  />

  @if (isPassword()) {
    <button
      class="nds-input__toggle"
      type="button"
      [attr.aria-label]="
        passwordVisible()
          ? 'Hide password'
          : 'Show password'
      "
      [attr.aria-pressed]="passwordVisible()"
      [disabled]="isDisabled()"
      (click)="togglePasswordVisibility()"
    >
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" aria-hidden="true">
        @if (passwordVisible()) {
          <path d="M3 3l18 18M10.6 10.6a2 2 0 0 0 2.8 2.8M9.9 4.2A10.8 10.8 0 0 1 12 4c5.5 0 9.3 5.1 10 7.4a12.8 12.8 0 0 1-3 4.4M6.6 6.6A12.8 12.8 0 0 0 2 11.4C2.7 13.7 6.5 18 12 18c1 0 2-.2 2.9-.6" />
        } @else {
          <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z" />
          <circle cx="12" cy="12" r="3" />
        }
      </svg>
    </button>
  }

  <div class="nds-input__suffix">
    <ng-content select="[ndsSuffix]" />
  </div>

</div>
